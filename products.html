<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEASON 01 / 2026 — 설백 雪白</title>
  <meta name="description" content="중촌동의 시간을 다섯 가지 색으로 엮은 설백의 2026 시즌 컬렉션." />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="products-page" data-page="products">
  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo" aria-label="설백 홈"><span class="logo-latin">SEOLBAEK · 雪白</span><span class="logo-korean">설백</span></a>
      <button class="nav-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <nav class="nav-menu" aria-label="주요 메뉴">
        <a href="index.html" data-i18n="nav.home">홈</a><a href="products.html" class="active" data-i18n="nav.collection">제품</a><a href="portfolio.html" data-i18n="nav.portfolio" data-i18n-ko="포트폴리오">포트폴리오</a><a href="about.html" data-i18n="nav.about">브랜드 소개</a><a href="contact.html" data-i18n="nav.contact">문의</a><a href="cart.html" class="cart-nav-link" data-cart-link aria-label="장바구니 0"><span data-i18n="cart.label" data-i18n-ko="장바구니">장바구니</span> <span data-cart-count>0</span></a>
      </nav>
      <div class="language-switch" role="group" aria-label="언어 선택"><button type="button" data-language="ko" aria-pressed="true">KR</button><span>/</span><button type="button" data-language="en" aria-pressed="false">EN</button></div>
    </div>
  </header>

  <main>
    <section class="collection-head">
      <div><h1><span class="season-year-group">SEOLBAEK</span> <span class="season-year-group">COLLECTION</span></h1></div>
      <div><p class="collection-kicker" data-i18n="collection.kicker">옷과 원단에 집중하는 첫 번째 시즌</p><p data-i18n="collection.body">투명한 원단에 스미는 빛, 가벼운 주름과 레이어링을 따라 네 개의 LOOK을 만납니다.</p></div>
    </section>

    <section class="section collection-catalog">
      <div class="collection-rule"><span>2026 COLLECTION</span><span>SEOLBAEK · 雪白</span></div>
      <div class="catalog-filters" role="group" aria-label="제품 카테고리">
        <button type="button" class="active" data-mode="purchase" aria-pressed="true">구매</button>
        <button type="button" data-mode="rental" aria-pressed="false" data-i18n="category.rental">대여</button>
      </div>
      <div class="catalog-subfilters" role="group" aria-label="구매 카테고리">
        <button type="button" class="active" data-category="clothing" aria-pressed="true" data-i18n="category.clothing">의상</button>
        <button type="button" data-category="accessories" aria-pressed="false" data-i18n="category.accessories">장신구</button>
      </div>
      <!-- 제품 데이터는 products.json에서만 자동으로 불러옵니다. -->
      <div class="lookbook-grid catalog-grid" id="product-list" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer-wordmark">SEOLBAEK · 雪白 <span>설백</span></p><p class="footer-line">SEASON 01 / 2026</p><p class="biz" data-i18n="footer.pending">사업자 정보와 공식 연락처는 브랜드 담당자 확인 후 표기됩니다.</p><p>© 2026 SEOLBAEK. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="catalog.js?v=20260826-rich-editor-1"></script><script src="cart.js"></script>
  <script>
    let catalogProducts = [];
    let selectedCategory = "clothing";
    function filterProducts(category) {
      return catalogProducts.filter((product) => {
        const text = [product.category, product.label, product.name, ...(product.keywords || [])].join(" ").toLowerCase();
        // 대여는 기존 목록 판정식을 유지합니다. 구매는 실제 구분 값으로 대여 전용을 제외합니다.
        if (category === "rental") return /대여|rental|rent/.test(text);
        const metadata = [product.category, product.label, ...(product.keywords || [])].join(" ").toLowerCase();
        const rentalOnly = /대여|rental|rent/.test(metadata) && !/구매|purchase/.test(metadata.replace(/구매\s*·\s*대여\s*:/g, ""));
        if (rentalOnly) return false;
        const accessory = /장신구|액세서리|accessor|jewelry/.test(metadata);
        return category === "accessories" ? accessory : !accessory;
      });
    }
    function renderCategory(category) {
      const box = document.getElementById("product-list");
      const filtered = filterProducts(category);
      // 상품이 없는 카테고리에는 실제 상품 대신 이미지 준비 자리만 표시합니다.
      box.innerHTML = filtered.length ? window.SeolbaekUI.renderCatalog(filtered) : window.SeolbaekUI.renderProductSlots([], 2, { compact: true });
      window.SeolbaekReveal && window.SeolbaekReveal();
    }
    function selectCategory(category, updateUrl = true) {
      selectedCategory = ["clothing", "accessories", "rental"].includes(category) ? category : "clothing";
      const rental = selectedCategory === "rental";
      document.querySelector(".catalog-subfilters").hidden = rental;
      document.querySelectorAll("[data-mode], [data-category]").forEach((item) => {
        const active = item.dataset.mode ? item.dataset.mode === (rental ? "rental" : "purchase") : item.dataset.category === selectedCategory;
        item.classList.toggle("active", active);
        item.setAttribute("aria-pressed", String(active));
      });
      if (updateUrl) {
        const url = new URL(location.href);
        url.searchParams.set("category", selectedCategory);
        history.replaceState(null, "", url);
      }
      renderCategory(selectedCategory);
    }
    document.querySelectorAll("[data-category]").forEach((button) => button.addEventListener("click", () => selectCategory(button.dataset.category)));
    document.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => selectCategory(button.dataset.mode === "rental" ? "rental" : "clothing")));
    ProductCatalog.loadVisibleProducts().then((products) => {
      catalogProducts = window.SeolbaekProductPresets.apply(products);
      selectCategory(new URLSearchParams(location.search).get("category"), false);
    }).catch(() => { document.getElementById("product-list").innerHTML = window.SeolbaekUI.catalogMessage("loadError"); });
    window.addEventListener("seolbaek:language", () => renderCategory(selectedCategory));
  </script>
</body>
</html>
